[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supermarket-ai-platform"
version = "1.0.0"
description = "AI Supermarket Demand Forecasting & Inventory Assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Engineer", email = "ai.engineer@example.com"}
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "scikit-learn==1.3.2",
    "xgboost==2.0.2",
    "prophet==1.1.5",
    "statsmodels==0.14.0",
    "langchain==0.0.340",
    "langchain-community==0.0.10",
    "chromadb==0.4.22",
    "openai==1.3.0",
    "tiktoken==0.5.1",
    "mlflow==2.8.1",
    "prometheus-client==0.19.0",
    "python-json-logger==2.0.7",
    "httpx==0.25.1",
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "ruff==0.1.6",
    "mypy==1.7.0"
]

[project.optional-dependencies]
dev = [
    "jupyter==1.0.0",
    "ipython==8.17.2"
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true